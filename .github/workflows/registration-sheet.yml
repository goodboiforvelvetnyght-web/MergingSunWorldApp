name: Connect event registration spreadsheet
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Event identifier
        required: true
        type: string
      spreadsheet_url:
        description: Spreadsheet shared with the runtime service account as Editor
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  connect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: auth
        with:
          project_id: mergingsunapp-2
          workload_identity_provider: projects/277886772831/locations/global/workloadIdentityPools/merging-sun-github/providers/github
          service_account: github-deploy@mergingsunapp-2.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://asia-southeast1-mergingsunapp-2.cloudfunctions.net/configureRegistrationSheetDeployment
          id_token_include_email: true
      - name: Connect the specified sheet and queue existing requests
        env:
          EVENT_ID: ${{ inputs.event_id }}
          SPREADSHEET_URL: ${{ inputs.spreadsheet_url }}
          SETUP_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          node -e 'require("fs").writeFileSync("/tmp/sheet-setup.json",JSON.stringify({eventId:process.env.EVENT_ID,url:process.env.SPREADSHEET_URL}))'
          curl --fail-with-body --silent --show-error --max-time 120 -H "Authorization: Bearer $SETUP_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/sheet-setup.json https://asia-southeast1-mergingsunapp-2.cloudfunctions.net/configureRegistrationSheetDeployment
